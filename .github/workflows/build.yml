name: Build AppData (Rootless, iOS 26)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools (ldid / dpkg / make)
        run: |
          # ldid = fake-sign the dylib; dpkg = package the .deb;
          # GNU make >= 4.x is REQUIRED by Theos (macOS ships make 3.81).
          brew install ldid dpkg fakeroot make || true
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"
          command -v ldid && ldid -V 2>/dev/null || echo "WARN: ldid missing"
          command -v make && make --version | head -1

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK (theos/sdks)
        run: |
          mkdir -p "$THEOS/sdks" /tmp/sdk
          # Highest SDK shipped by theos/sdks is iPhoneOS16.5; we build against it
          # (AppData uses runtime class lookup, so targeting iOS 26 is fine).
          gh release download -R theos/sdks --pattern 'iPhoneOS16.5.sdk.tar.xz' --dir /tmp/sdk 2>/dev/null \
            || curl -fsSL -o /tmp/sdk/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          SDK=$(ls /tmp/sdk/iPhoneOS16.5.sdk.tar.xz 2>/dev/null | head -1)
          if [ -z "$SDK" ]; then
            echo "::error::Could not obtain iPhoneOS16.5.sdk"; exit 1
          fi
          echo "Extracting $SDK"
          tar -xf "$SDK" -C "$THEOS/sdks"
          ls -1 "$THEOS/sdks"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify vendored headers (substrate.h)
        run: |
          # substrate.h is committed at ./include so the build needs no network.
          ls -1 include
          test -f include/substrate.h && echo "substrate.h present" || { echo "::error::include/substrate.h missing"; exit 1; }

      - name: Build package (rootless)
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH"
          make package FINALPACKAGE=1
        env:
          # ElleKit is the injection substrate; symbols resolve at runtime.
          THEOS_PACKAGE_SCHEME: rootless

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdata-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV"..HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          fi
          {
            echo "Automated rootless build for iOS 26.0.1 (Dopamine 3 + ElleKit)."
            echo ""
            echo "## Changes"
            echo "$LOG"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
